
name: Extract Project ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="sinsitersultimate-fixed.zip"
          test -f "$ZIP_FILE"

          mkdir -p /tmp/project
          unzip -q "$ZIP_FILE" -d /tmp/project

          ROOT="$(find /tmp/project -type f -name server.js -printf '%h\n' | head -n 1)"
          if [ -z "$ROOT" ]; then
            echo "Could not find server.js inside ZIP"
            find /tmp/project -maxdepth 3 -type f | head -80
            exit 1
          fi

          cp -a "$ROOT"/. .

          # Do not commit environment secrets
          rm -f .env
          find . -type f \( -name '.env' -o -name '.env.*' \) \
            ! -name '.env.example' -delete

          rm -f "$ZIP_FILE"
          rm -rf /tmp/project

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract project files from ZIP"
          git push
